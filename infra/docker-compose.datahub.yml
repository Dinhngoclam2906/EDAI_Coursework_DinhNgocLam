version: '3.8'

# FinGuard — DataHub metadata & lineage catalog
#
# Start: docker compose -f infra/docker-compose.datahub.yml up -d
#
# DataHub UI: http://localhost:9002  (datahub / datahub)
# DataHub GMS API: http://localhost:8085
#
# Requires finguard-net and Kafka — start main docker-compose.yml first.

networks:
  finguard-net:
    external: true

services:

  # ── DataHub backend DB ───────────────────────────────────────────────────────
  datahub-postgres:
    image: postgres:15-alpine
    container_name: datahub-postgres
    environment:
      POSTGRES_USER: datahub
      POSTGRES_PASSWORD: datahub_password
      POSTGRES_DB: datahub
    volumes:
      - datahub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datahub"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - finguard-net

  # ── OpenSearch (search / graph backend) ─────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.19.3
    hostname: search
    container_name: datahub-opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx1024m"
    healthcheck:
      test: ["CMD-SHELL", "curl -sS --fail 'http://search:9200/_cluster/health?wait_for_status=yellow&timeout=0s'"]
      interval: 5s
      timeout: 15s
      retries: 10
      start_period: 60s
    networks:
      finguard-net:
        aliases:
          - search

  # ── DataHub system-update (DB migrations + index setup, exits when done) ─────
  datahub-system-update:
    image: acryldata/datahub-upgrade:v1.5.0.6
    hostname: datahub-system-update
    command: ["-u", "SystemUpdate"]
    depends_on:
      datahub-postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      EBEAN_DATASOURCE_URL: "jdbc:postgresql://datahub-postgres:5432/datahub"
      EBEAN_DATASOURCE_DRIVER: "org.postgresql.Driver"
      EBEAN_DATASOURCE_USERNAME: datahub
      EBEAN_DATASOURCE_PASSWORD: datahub_password
      EBEAN_DATASOURCE_HOST: datahub-postgres:5432
      ELASTICSEARCH_HOST: search
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_PROTOCOL: http
      ELASTICSEARCH_USE_SSL: "false"
      ELASTICSEARCH_IMPLEMENTATION: opensearch
      ELASTICSEARCH_INDEX_BUILDER_MAPPINGS_REINDEX: "true"
      ELASTICSEARCH_INDEX_BUILDER_SETTINGS_REINDEX: "true"
      ELASTICSEARCH_INDEX_BUILDER_REFRESH_INTERVAL_SECONDS: "3"
      ELASTICSEARCH_BUILD_INDICES_CLONE_INDICES: "false"
      KAFKA_BOOTSTRAP_SERVER: kafka:19092
      GRAPH_SERVICE_IMPL: elasticsearch
      ENTITY_REGISTRY_CONFIG_PATH: /datahub/datahub-gms/resources/entity-registry.yml
      DATAHUB_SQL_SETUP_ENABLED: "true"
      DATAHUB_PRECREATE_TOPICS: "true"
      METADATA_SERVICE_AUTH_ENABLED: "false"
      DATAHUB_TOKEN_SERVICE_SIGNING_KEY: "WnEdIeTG/VVCLQqGwC/BAkqyY0k+H8NEAtWGejrBI94="
      DATAHUB_TOKEN_SERVICE_SALT: "YouKnowNothingJohnSnow"
      DATAHUB_GMS_HOST: datahub-gms
      DATAHUB_GMS_PORT: "8080"
      KAFKA_SCHEMAREGISTRY_URL: "http://datahub-gms:8080/schema-registry/api/"
      SCHEMA_REGISTRY_TYPE: INTERNAL
      SCHEMA_REGISTRY_SYSTEM_UPDATE: "true"
      SPRING_KAFKA_PROPERTIES_AUTO_REGISTER_SCHEMAS: "true"
      SPRING_KAFKA_PROPERTIES_USE_LATEST_VERSION: "true"
      USE_CONFLUENT_SCHEMA_REGISTRY: "false"
      ENTITY_VERSIONING_ENABLED: "true"
      PARTITIONS: "3"
    networks:
      - finguard-net

  # ── DataHub GMS (core API + Kafka→OpenSearch consumers) ─────────────────────
  datahub-gms:
    image: acryldata/datahub-gms:v1.5.0.6
    hostname: datahub-gms
    container_name: datahub-gms
    depends_on:
      datahub-system-update:
        condition: service_completed_successfully
    ports:
      - "8085:8080"
    environment:
      EBEAN_DATASOURCE_URL: "jdbc:postgresql://datahub-postgres:5432/datahub"
      EBEAN_DATASOURCE_DRIVER: "org.postgresql.Driver"
      EBEAN_DATASOURCE_USERNAME: datahub
      EBEAN_DATASOURCE_PASSWORD: datahub_password
      EBEAN_DATASOURCE_HOST: datahub-postgres:5432
      ELASTICSEARCH_HOST: search
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_PROTOCOL: http
      ELASTICSEARCH_USE_SSL: "false"
      ELASTICSEARCH_IMPLEMENTATION: opensearch
      KAFKA_BOOTSTRAP_SERVER: kafka:19092
      KAFKA_SCHEMAREGISTRY_URL: "http://datahub-gms:8080/schema-registry/api/"
      GRAPH_SERVICE_IMPL: elasticsearch
      GRAPH_SERVICE_DIFF_MODE_ENABLED: "false"
      ENTITY_REGISTRY_CONFIG_PATH: /datahub/datahub-gms/resources/entity-registry.yml
      METADATA_SERVICE_AUTH_ENABLED: "false"
      DATAHUB_TOKEN_SERVICE_SIGNING_KEY: "WnEdIeTG/VVCLQqGwC/BAkqyY0k+H8NEAtWGejrBI94="
      DATAHUB_TOKEN_SERVICE_SALT: "YouKnowNothingJohnSnow"
      SCHEMA_REGISTRY_TYPE: INTERNAL
      SPRING_KAFKA_PROPERTIES_AUTO_REGISTER_SCHEMAS: "true"
      SPRING_KAFKA_PROPERTIES_USE_LATEST_VERSION: "true"
      USE_CONFLUENT_SCHEMA_REGISTRY: "false"
      MAE_CONSUMER_ENABLED: "true"
      MCE_CONSUMER_ENABLED: "true"
      PE_CONSUMER_ENABLED: "true"
      ENTITY_SERVICE_ENABLE_RETENTION: "true"
      ENTITY_VERSIONING_ENABLED: "true"
      UI_INGESTION_ENABLED: "true"
      DATAHUB_SERVER_TYPE: quickstart
      DATAHUB_TELEMETRY_ENABLED: "false"
      DATAHUB_BASE_PATH: /
      DATAHUB_GMS_BASE_PATH: /
    healthcheck:
      test: ["CMD-SHELL", "curl -sS --fail http://datahub-gms:8080/health"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 90s
    networks:
      - finguard-net

  # ── DataHub Actions (ingestion executor) ─────────────────────────────────────
  datahub-actions:
    image: acryldata/datahub-actions:v0.0.15
    hostname: actions
    container_name: datahub-actions
    depends_on:
      datahub-gms:
        condition: service_healthy
    environment:
      DATAHUB_GMS_HOST: datahub-gms
      DATAHUB_GMS_PORT: "8080"
      DATAHUB_GMS_PROTOCOL: http
      DATAHUB_SYSTEM_CLIENT_ID: __datahub_system
      DATAHUB_SYSTEM_CLIENT_SECRET: JohnSnowKnowsNothing
      KAFKA_BOOTSTRAP_SERVER: kafka:19092
      KAFKA_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT
      SCHEMA_REGISTRY_URL: "http://datahub-gms:8080/schema-registry/api/"
    networks:
      - finguard-net

  # ── DataHub Frontend (React UI) ──────────────────────────────────────────────
  datahub-frontend:
    image: acryldata/datahub-frontend-react:v1.5.0.6
    hostname: datahub-frontend-react
    container_name: datahub-frontend
    depends_on:
      datahub-gms:
        condition: service_healthy
    ports:
      - "9002:9002"
    environment:
      DATAHUB_GMS_HOST: datahub-gms
      DATAHUB_GMS_PORT: "8080"
      DATAHUB_SECRET: "YouKnowNothing"
      DATAHUB_APP_VERSION: "v1.5.0.6"
      DATAHUB_PLAY_MEM_BUFFER_SIZE: "10MB"
      KAFKA_BOOTSTRAP_SERVER: kafka:19092
      ELASTIC_CLIENT_HOST: search
      ELASTIC_CLIENT_PORT: "9200"
      DATAHUB_BASE_PATH: /
      DATAHUB_GMS_BASE_PATH: /
    networks:
      - finguard-net

volumes:
  datahub_postgres_data:
